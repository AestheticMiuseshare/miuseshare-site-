name: Sync Track Catalog
on:
  push:
    paths:
      - 'pages/songscatalog.txt'
      - 'pages/**'
      - 'index.html'
      - 'scripts/**'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run sync script
        run: python scripts/updatesonglist.py
      - name: Refresh sitemap
        run: python scripts/updatesitemap.py
      - name: Commit & push changes
        run: |
          git config --global user.name "AestheticMiuseshare"
          git config --global user.email "AestheticMiuseshare@users.noreply.github.com"
          git add llms.txt pages/songlist.html sitemap.xml
          git diff --cached --quiet || git commit -m "Auto sync: refresh llms.txt, songlist.html and sitemap.xml"
          git push
