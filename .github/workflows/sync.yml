name: Sync Track Catalog
on:
  push:
    paths:
      - 'pages/songscatalog.txt'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run update-songlist script
        run: python scripts/update-songlist.py
      - name: Commit & push changes
        run: |
          git config --global user.name "AestheticMiuseshare"
          git config --global user.email "AestheticMiuseshare@users.noreply.github.com"
          git add llms.txt pages/songlist.html
          git commit -m "Auto sync: refresh llms.txt and songlist.html"
          git push
