    <p>自学吉他，编写面向作曲方向的吉他教程；自学钢琴，掌握钢琴调音，拥有数年钢琴弹唱的练习经历；自学萨克斯，可流畅演奏流行曲目。拥有十余年摄影经验，同时开发过乐理与作曲教学类软件。</p>
