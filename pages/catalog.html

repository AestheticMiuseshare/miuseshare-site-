<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曲目清单 | AestheticMiuseshare</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            max-width:820px;
            margin:3rem auto;
            padding:0 1rem;
            font-family:system-ui,-apple-system,sans-serif;
            line-height:1.75;
            color:#222;
        }
        h1{font-size:2rem;margin-bottom:0.4rem}
        p.sub{color:#777;margin-bottom:2rem;font-size:0.95rem}
        h2{
            font-size:1.2rem;
            margin:2rem 0 0.8rem;
            padding-bottom:0.4rem;
            border-bottom:1px solid #e5e5e5;
        }
        .item{
            padding:0.9rem 1rem;
            margin-bottom:0.8rem;
            background:#fafafa;
            border-left:3px solid #2563eb;
            border-radius:4px;
        }
        .item .name{font-weight:600;font-size:1.05rem}
        .item .meta{color:#666;font-size:0.9rem}
        .item a{
            display:inline-block;
            margin-top:0.4rem;
            color:#2563eb;
            font-size:0.9rem;
            word-break:break-all;
        }
        .tags{color:#888;font-size:0.85rem;margin-top:0.5rem;word-break:break-all}
        .err{color:#b91c1c;font-size:0.9rem}
        a.back{display:inline-block;margin-top:2.5rem;color:#2563eb;text-decoration:none}
        a.back:hover{text-decoration:underline}
    </style>
</head>
<body>
    <h1>曲目清单</h1>
    <p class="sub">Track List · 数据来源 catalog.txt</p>

    <div id="list">载入中…</div>

    <a class="back" href="../index.html">← 返回首页</a>

<script>
fetch('../catalog.txt')
  .then(r => r.ok ? r.text() : Promise.reject(r.status))
  .then(text => {
    const box = document.getElementById('list');
    box.innerHTML = '';
    const lines = text.split('\n').map(l => l.trim());
    let group = null, groups = [];
    lines.forEach(line => {
      if (!line) return;
      if (line.startsWith('#')) {
        const name = line.replace(/^#+\s*/, '');
        if (name && !line.includes(',')) {
          group = { title: name, items: [] };
          groups.push(group);
          return;
        }
      }
      if (!group) { group = { title: '曲目', items: [] }; groups.push(group); }
      const item = group.items[group.items.length - 1];
      if (/^https?:/.test(line)) {
        if (item) item.link = line;
        return;
      }
      if (line.includes(',')) {
        if (item) item.tags = item.tags ? item.tags + ' ' + line : line;
        return;
      }
      const parts = line.split('|').map(s => s.trim());
      group.items.push({ name: parts[0].replace(/^\d+\.\s*/, ''), meta: parts.slice(1).join(' · '), link: '', tags: '' });
    });
    groups.forEach(g => {
      if (!g.items.length) return;
      const h2 = document.createElement('h2');
      h2.textContent = g.title;
      box.appendChild(h2);
      g.items.forEach(it => {
        const d = document.createElement('div');
        d.className = 'item';
        d.innerHTML = '<div class="name"></div><div class="meta"></div>' +
          (it.link ? '<a></a>' : '') +
          (it.tags ? '<div class="tags"></div>' : '');
        d.querySelector('.name').textContent = it.name;
        d.querySelector('.meta').textContent = it.meta;
        if (it.link) {
          const a = d.querySelector('a');
          a.href = it.link;
          a.textContent = '收听链接 →';
        }
        if (it.tags) d.querySelector('.tags').textContent = it.tags;
        box.appendChild(d);
      });
    });
    if (!box.children.length) box.textContent = '暂无曲目。';
  })
  .catch(() => {
    document.getElementById('list').innerHTML =
      '<p class="err">catalog.txt 读取失败，请确认根目录存在 catalog.txt，且页面通过线上地址访问。</p>';
  });
</script>
</body>
</html>
