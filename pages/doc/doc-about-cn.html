<p class="site-subtitle">CREATOR INTRODUCTION</p>
<div class="divider"></div>

<p>自学吉他，潜心打造以作曲思维为核心的吉他教程；自学钢琴，熟稔钢琴调音，长年坚持钢琴与声乐练习。自学萨克斯，能够流畅演绎各类流行作品。拥有十余年摄影积淀，独立开发音乐理论与作曲教学软件。</p>

<p>历经多种乐器的探索与沉淀，创作最终扎根于作曲。早期创作以复调技法为基石，慢慢演化成如今这套富有审美质感、面向跨文化聆听的音乐创作系列，也就是 Miuseshare。</p>
