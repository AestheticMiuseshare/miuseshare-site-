    <h1>创作者简介</h1>
    <p>Miuseshare，独立世界音乐创作者。</p>
    <p>擅长以复调钢琴为主，融合不同地域的律动与音色，创作偏向治愈、沉思气质的世界音乐作品。</p>
    <p>同时搭建 AestheticMiuseshare 审美体系，把音乐、绘画视觉、人文思考整合在一起，形成一套统一的创作语言。</p>
    <p>作品主题多围绕漂泊、自然、乡愁、人与大地的平衡，不追求喧闹的流量风格。</p>
