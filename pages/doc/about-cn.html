<h1 class="site-title">创作者简介</h1>
<p class="site-subtitle">CREATOR INTRODUCTION</p>
<div class="divider"></div>
<p>自学吉他、钢琴、萨克斯，编写面向多声部作曲的吉他教材；拥有五年钢琴弹唱练习经验，可进行钢琴调音；制作五线谱记忆辅助教学卡，独立开发乐理与作曲学习软件。十余年摄影积淀。以上全部为自学。创作初期以复调为主，后走向多风格创作，打造面向跨文化聆听、富有审美质感群体的音乐项目：Miuseshare。</p>
<p>经过多年的学习与探索，如今成为一名注重艺术内涵与文化底蕴的独立艺术创作者，作品涵盖音乐、图片与文字。</p>
