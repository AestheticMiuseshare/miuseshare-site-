<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miuseshare | 曲目清单</title>
<meta name="description" content="Miuseshare完整曲目清单">
<link rel="stylesheet" href="../style.css">
<style>
.track-block{
  margin-bottom:1.6rem;
  padding:1rem;
  border:1px solid #ddd;
  border-radius:12px;
}
.group-title-single{
  font-size:1.2rem;
  font-weight:bold;
  margin:2rem 0 0.8rem;
  color:#222;
}
.group-title-album{
  font-size:1.3rem;
  font-weight:bold;
  margin:2.2rem 0 1rem;
  color:#1a1a1a;
  border-bottom:1px solid #cccccc;
  padding-bottom:0.4rem;
}
.track-name{
  font-size:1rem;
  font-weight:bold;
}
.track-meta{
  font-size:0.88rem;
  color:#555;
  margin:0.4rem 0 0.8rem;
}
.play-btn{
  display:inline-block;
  padding:0.4rem 0.8rem;
  background:#f4f4f4;
  border:1px solid #ccc;
  border-radius:8px;
  text-decoration:none;
  color:#222;
  font-size:0.85rem;
}
.play-btn:active{
  background:#e9e9e9;
}
.tag-group{
  margin-top:0.8rem;
}
.tag-item{
  display:inline-block;border:1px solid #777;border-radius:999px;padding:.22rem .6rem;margin:.2rem .15rem;color:#222;font-size:.8rem;
}
</style>
</head>
<body>
<h1 class="site-title">曲目清单</h1>
<p class="site-subtitle">Song Catalog</p>
<div class="divider"></div>
<div id="wrap"></div>
<div class="card-list">
  <a class="card" href="catalog.html">
    <div class="card-text">
      <span class="card-main">返回收听页面</span>
      <span class="card-sub">Back</span>
    </div>
    <span class="card-arrow">→</span>
  </a>
</div>
<script>
const wrap = document.querySelector('#wrap');
const mockText = `# Single
1. Shackles | Artist:Miuseshare | world music, rap
https://song.link/s/0zRsSSJjkyZILkWoRnFoXs
#AestheticMiuseshare,#AestheticDirection,#LiteraryAesthetic,#WorldMusic,#PaintingAesthetic
#AestheticMiuseshare,#审美方向,#文学审美,#世界音乐,#绘画审美

# Single
2. Fragrant Shoulder Beauty | Artist:Miuseshare | world music, lofi
https://song.link/s/6B044eLbIiTFBI5wdQqDGI
#AestheticMiuseshare,#AestheticDirection,#LiteraryAesthetic,#WorldMusic,#PaintingAesthetic
#AestheticMiuseshare,#审美方向,#文学审美,#世界音乐,#绘画审美

# Single
3. Wind in Your Ear | Artist:Miuseshare | world music, pop
https://song.link/y/mEC4X383oyQ
#AestheticMiuseshare,#AestheticDirection,#LiteraryAesthetic,#WorldMusic,#PaintingAesthetic
#AestheticMiuseshare,#审美方向,#文学审美,#世界音乐,#绘画审美
`;
function parseBlock(blockLines){
  let groupRaw = '';
  let info = '';
  let link = '';
  let tagLines = [];
  for(let l of blockLines){
    const t = l.trim();
    if(t.startsWith('# ') && !t.startsWith('#Aesthetic')){
      groupRaw = t.replace('# ','');
    }else if(t.startsWith('http')){
      link = t;
    }else if(t.startsWith('#Aesthetic')){
      tagLines.push(t);
    }else if(t !== ''){
      info = t;
    }
  }
  const sp = info.split(' | ');
  const namePart = sp[0];
  const artist = sp[1] ?? '';
  const genre = sp.slice(2).join(' ');
  let allTags = [];
  for(let tagLine of tagLines){
    const arr = tagLine.split(',');
    for(let s of arr){
      allTags.push(s.replace('#',''));
    }
  }
  allTags = [...new Set(allTags)];
  let tagHtml = '';
  for(let t of allTags){
    tagHtml += `<span class="tag-item">${t}</span>`;
  }
  let groupHtml = '';
  if(groupRaw){
    if(groupRaw.trim() === 'Single'){
      groupHtml = `<div class="group-title-single">Single 单曲</div>`;
    }else{
      groupHtml = `<div class="group-title-album">${groupRaw}</div>`;
    }
  }
  const linkHtml = link
    ? `<a class="play-btn" href="${link}" target="_blank" rel="noopener noreferrer">Play</a>`
    : '';
  return `
${groupHtml}
<div class="track-block">
  <div class="track-name">${namePart}</div>
  <div class="track-meta">${artist} &nbsp;｜&nbsp; ${genre}</div>
  ${linkHtml}
  <div class="tag-group">${tagHtml}</div>
</div>
`;
}
function renderAll(text){
  const blocks = text.split(/\n\n+/);
  let html = '';
  for(const b of blocks){
    const lines = b.split('\n');
    html += parseBlock(lines);
  }
  wrap.innerHTML = html;
}
renderAll(mockText);
</script>
</body>
</html>
